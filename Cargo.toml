[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chaotic-ground/olbaro"
rust-version = "1.85"

[workspace.dependencies]
olbaro-core = { path = "crates/olbaro-core" }
olbaro-rules = { path = "crates/olbaro-rules" }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.11"
